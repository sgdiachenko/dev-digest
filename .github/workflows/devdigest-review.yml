# Generated by DevDigest. Re-export from the studio to update it.
name: DevDigest review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: devdigest-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Run DevDigest agents
        run: node .devdigest/runner/index.js
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload result (general-reviewer)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: devdigest-result-general-reviewer
          path: .devdigest-results/general-reviewer/devdigest-result.json
          if-no-files-found: ignore
      - name: Fail when an agent produced no result
        if: always()
        run: |
          missing=0
          for manifest in .devdigest/agents/*.yaml; do
            [ -e "$manifest" ] || continue
            slug="$(basename "$manifest" .yaml)"
            if [ ! -f ".devdigest-results/$slug/devdigest-result.json" ]; then
              echo "No DevDigest result for agent: $slug"
              missing=1
            fi
          done
          exit $missing
